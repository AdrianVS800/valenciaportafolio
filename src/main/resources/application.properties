server.port=8080
# Detrás del proxy de Azure (HTTPS) la app reconoce el protocolo y host reales
server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB
# En Azure define UPLOADS_DIR=/home/uploads (carpeta persistente)
portafolio.carpeta-subidas=${UPLOADS_DIR:uploads}

# Administrador inicial (solo se crea si la tabla usuarios está vacía; la clave se guarda cifrada con BCrypt)
admin.email=${ADMIN_EMAIL:adrianmix800@gmail.com}
admin.password=${ADMIN_PASSWORD:adrian999.net}

# --- Base de datos MySQL: portavirtual (se crea sola si no existe) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/portavirtual?createDatabaseIfNotExist=true&sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
