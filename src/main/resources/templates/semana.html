<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragmentos :: head(${semana.titulo})}"></head>
<body>
<header th:replace="~{fragmentos :: navPublico}"></header>
<main>
  <section class="sec mar pagina">
    <div class="olas" aria-hidden="true"><div class="ola ola1"></div><div class="ola ola2"></div><div class="ola ola3"></div></div>
    <div class="wrap">
      <a class="ver" href="/#semanas">← Todas las semanas</a>
      <p class="eyebrow" style="margin-top:28px" th:text="'W' + ${semana.numero} + ' · Trabajos'">W1</p>
      <h2 th:text="${semana.titulo}">Semana 1</h2>
      <p class="texto" th:text="${semana.descripcion}"></p>
      <p class="suave" th:if="${#lists.isEmpty(documentos)}" style="margin-top:24px">Aún no hay trabajos publicados en esta semana.</p>
      <div class="grid-doc">
        <article class="doc reveal" th:each="d, it : ${documentos}" th:style="'--i:' + ${it.index % 3}">
          <div class="icono" th:classappend="${d.claseTipo}" th:text="${d.tipo == 'Word' ? 'W' : (d.tipo == 'Excel' ? 'X' : 'PDF')}">PDF</div>
          <h3 th:text="${d.titulo}">Trabajo</h3>
          <p th:if="${!#strings.isEmpty(d.descripcion)}" th:text="${d.descripcion}"></p>
          <p class="meta"><span th:text="${d.tipo}">PDF</span> · <span th:text="${d.tamanoLegible}">1 MB</span> · <span th:text="${#temporals.format(d.fecha, 'dd/MM/yyyy')}">01/01/2026</span></p>
          <a class="ver" th:href="@{/archivo/{id}(id=${d.id})}">Descargar →</a>
        </article>
      </div>
      <div class="pager">
        <a class="pildora" th:if="${semana.numero > 1}" th:href="@{/semana/{n}(n=${semana.numero - 1})}">← Semana anterior</a>
        <span th:if="${semana.numero <= 1}"></span>
        <a class="pildora" th:if="${semana.numero < 16}" th:href="@{/semana/{n}(n=${semana.numero + 1})}">Semana siguiente →</a>
      </div>
    </div>
  </section>
</main>
</body>
</html>
